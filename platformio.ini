; PlatformIO Project Configuration File
; Projeto: Jogando Junto - 6º Ano B (InovaCEV 2026)
; Placa: ESP32 DevKit V1
; Orientação: Prof. Luis Felipe Patrocínio (patrodev.com)

[platformio]
default_envs = esp32doit-devkit-v1
src_dir = src

[env:esp32doit-devkit-v1]
; Fixamos a plataforma espressif32 na versao 6.5.0 (Arduino Core 2.0.14)
; Isso garante 100% de estabilidade com a biblioteca BleKeyboard clássica!
platform = espressif32@6.5.0
board = esp32doit-devkit-v1
framework = arduino

; Velocidade de upload e monitor serial
monitor_speed = 115200
upload_speed = 921600

; Dependencias instaladas automaticamente pelo PlatformIO
lib_deps =
    https://github.com/T-vK/ESP32-BLE-Keyboard.git
